# Nguồn khai báo target cho toàn pipeline (B phân tích spec + C fuzzing).
# Thêm/đổi target chỉ sửa file này, không đụng code.
# KHÔNG để secret ở đây: password/token dùng token_env trỏ tới biến môi trường (.env).

allowed_targets: [vampi, crapi, dvga, enterprise_staging, corporate_api]

targets:
  vampi:
    kind: rest                              # rest | graphql
    base_url: http://localhost:5002
    spec: dataset/vampi_openapi.json
    payload_out: Schemathesis/payload_rest.json
    nuclei_out: Nuclei/executor/benchmark/suite.json
    auth:
      type: login                           # none | login | static
      login_url: http://localhost:5002/users/v1/login
      register_url: http://localhost:5002/users/v1/register

  crapi:
    kind: rest
    base_url: http://localhost:8888
    spec: Schemathesis/crapi_openapi_spec.json
    payload_out: Schemathesis/payload_crapi.json
    auth:
      type: login
      login_url: http://localhost:8888/identity/api/auth/login
      register_url: http://localhost:8888/identity/api/auth/signup

  dvga:
    kind: graphql
    base_url: http://localhost:5013
    graphql_path: /graphql
    spec: dataset/dvga_schema.json
    payload_out: Schemathesis/payload_graphql.json
    auth:
      type: login

  # Target môi trường Staging / UAT thực tế của Doanh nghiệp (URL hoặc IP nội bộ)
  enterprise_staging:
    kind: rest
    base_url: https://staging-api.enterprise.local
    spec_url: https://staging-api.enterprise.local/v3/api-docs
    payload_out: results/payloads_enterprise.json
    auth:
      type: static
      token_env: ENTERPRISE_BEARER_TOKEN

  # Microservice nội bộ doanh nghiệp qua IP
  corporate_api:
    kind: rest
    base_url: http://10.0.1.50:8000
    spec_url: http://10.0.1.50:8000/openapi.json
    payload_out: results/payloads_corporate.json
    auth:
      type: static
      token_env: CORP_API_KEY
